<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Support Agent - Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      width: min(420px, 100%);
      height: 100vh;
      max-height: 650px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 480px) {
      .container {
        display: none;
      }
    }
    .header {
      background: #0176d3;
      color: white;
      padding: 14px;
      font-weight: bold;
      text-align: center;
    }
    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
      text-align: center;
    }
    .placeholder {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
    }
    .badge {
      margin-top: 12px;
      font-size: 12px;
      background: #eef4ff;
      color: #1a56db;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .footer {
      font-size: 12px;
      padding: 10px;
      border-top: 1px solid #eee;
      background: #fafafa;
      text-align: center;
      color: #888;
    }

    /* --- Widget unlock prompt --- */
    #widgetGate {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      padding: 16px;
      width: 240px;
      z-index: 20;
    }
    #widgetGate h3 {
      margin: 0 0 10px;
      font-size: 13px;
      color: #333;
    }
    #widgetGate input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    #widgetGate button {
      width: 100%;
      padding: 8px 10px;
      background: #0176d3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    #widgetGate button:hover {
      background: #015ba7;
    }
    #widgetGate .error {
      color: #c0392b;
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    AI Support Agent - Test
  </div>
  <div class="content">
    <div class="placeholder">
      This page integrates the <b>Enhanced Messaging v2</b> chat feature from Salesforce.
      <br><br>
    </div>
    <div class="badge">
      The chat widget is dynamically displayed in the bottom right corner of the browser window.
    </div>
  </div>
  <div class="footer">
    test environment
  </div>
</div>

<div id="widgetGate">
  <h3>Chat-Widget freischalten</h3>
  <input type="password" id="pwInput" placeholder="Enter password to load chat widget" autocomplete="off" />
  <button onclick="checkPassword()">OK</button>
  <div class="error" id="pwError"></div>
</div>

<script>
  // Einfache clientseitige Sperre — kein echter Sicherheitsmechanismus,
  // nur zum Fernhalten zufälliger Besucher auf einer Testseite.
  const CORRECT_PASSWORD_HASH = "3fb1e39508dad9ef90dd0c00cb6e5cd5d89f4b5c1ea2cae179a57010149cabb1";

  async function sha256(text) {
    const buffer = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buffer)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function checkPassword() {
    const input = document.getElementById("pwInput").value;
    const inputHash = await sha256(input);
    if (inputHash === CORRECT_PASSWORD_HASH) {
      sessionStorage.setItem("widget_pw_ok", "1");
      document.getElementById("widgetGate").style.display = "none";
      loadWidgetScript();
    } else {
      document.getElementById("pwError").textContent = "Falsches Passwort.";
    }
  }

  document.getElementById("pwInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") checkPassword();
  });

  function loadWidgetScript() {
    const script = document.createElement("script");
    script.type = "text/javascript";
    script.src = "https://kiauvocdp--agentforce.sandbox.my.site.com/ESWKiaConnectWebChat1784801498087/assets/js/bootstrap.min.js";
    script.onload = initEmbeddedMessaging;
    document.body.appendChild(script);
  }

  window.addEventListener("DOMContentLoaded", () => {
    if (sessionStorage.getItem("widget_pw_ok") === "1") {
      document.getElementById("widgetGate").style.display = "none";
      loadWidgetScript();
    }
  });

  function initEmbeddedMessaging() {
    try { 	  
      const urlParams = new URLSearchParams(window.location.search);
      const countryParam = urlParams.get('country') || 'de';
      const languageParam = urlParams.get('language') || 'en_US';
		
      embeddedservice_bootstrap.settings.language = languageParam;
      embeddedservice_bootstrap.init(
        '00D9V00000SLEUU',
        'Kia_Connect_Web_Chat',
        'https://kiauvocdp--agentforce.sandbox.my.site.com/ESWKiaConnectWebChat1784801498087',
        {
          scrt2URL: 'https://kiauvocdp--agentforce.sandbox.my.salesforce-scrt.com'
        }
      );

      window.addEventListener("onEmbeddedMessagingReady", () => {
				embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
					"webCountry": countryParam
				});
			});
      
    } catch (err) {
      console.error('Error loading Embedded Messaging: ', err);
    }
  }
</script>
</body>
</html>
